name: Abrechnungsportal prüfen
on:
  push:
    branches: [main, feature/verschluesselter-kundentresor]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript-Syntax
        run: |
          node --check app.js
          node --check kunden.js
      - name: Verschlüsselung & Monatsakten
        run: node --test tests/*.test.mjs
